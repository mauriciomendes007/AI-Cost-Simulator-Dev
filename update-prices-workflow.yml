name: Atualizar Preços dos Modelos LLM

on:
  schedule:
    - cron: '0 10 */2 * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Atualizar preços dos modelos
        run: |
          cat > update-prices.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          function fetchURL(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    reject(e);
                  }
                });
              }).on('error', reject);
            });
          }

          async function updatePrices() {
            const pricesData = {
              timestamp: new Date().toISOString(),
              sources: {
                openrouter: [],
                other_providers: []
              },
              model_count: 0,
              last_update: new Date().toLocaleString('pt-BR')
            };

            try {
              console.log('🔄 Buscando modelos de OpenRouter...');
              const openRouterData = await fetchURL('https://openrouter.ai/api/v1/models');
              
              if (openRouterData.data && Array.isArray(openRouterData.data)) {
                const validModels = openRouterData.data.filter(m => 
                  m.pricing && (m.pricing.prompt !== undefined || m.pricing.completion !== undefined)
                );
                
                pricesData.sources.openrouter = validModels;
                pricesData.model_count = validModels.length;
                
                console.log(`✅ ${validModels.length} modelos encontrados!`);
              }

              fs.writeFileSync('models-data.json', JSON.stringify(pricesData, null, 2));
              
              console.log('✅ Preços atualizados com sucesso!');
              console.log(`📊 Total de modelos: ${pricesData.model_count}`);
              
            } catch (error) {
              console.error('❌ Erro:', error.message);
              process.exit(1);
            }
          }

          updatePrices();
          EOF
          
          node update-prices.js

      - name: Commit e Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add models-data.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "🤖 Atualização automática de preços - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
