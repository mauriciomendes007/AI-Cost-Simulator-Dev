# Simulador de Custos de APIs (LLMs)

<div style="background: #f4f4f4; padding: 20px; border-radius: 8px; color: #333; margin-top: 20px;">
  <p>Insira o volume de tokens e escolha qualquer modelo disponível globalmente para prever o custo.</p>
  
  <div style="margin-bottom: 15px;">
    <label><strong>Tokens de Entrada (Input):</strong><br> 
      <input type="number" id="inputTokens" placeholder="Ex: 500000" style="padding: 8px; width: 100%; max-width: 400px; margin-top: 5px;">
    </label>
  </div>

  <div style="margin-bottom: 15px;">
    <label><strong>Tokens de Saída (Output):</strong><br> 
      <input type="number" id="outputTokens" placeholder="Ex: 100000" style="padding: 8px; width: 100%; max-width: 400px; margin-top: 5px;">
    </label>
  </div>

  <div style="margin-bottom: 20px;">
    <label><strong>Selecione o Modelo Global:</strong><br>
      <select id="modelSelect" style="padding: 8px; width: 100%; max-width: 400px; margin-top: 5px;">
        <option value="">Carregando modelos do mundo...</option>
      </select>
    </label>
  </div>

  <button onclick="calcularCusto()" style="padding: 10px 20px; background: #0366d6; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Calcular Custo</button>
  
  <h3 style="margin-top: 25px;">Custo Estimado: <span id="resultado" style="color: #28a745;">US$ 0.00</span></h3>
</div>

<script>
  let precosModelos = {};

  async function carregarModelos() {
    try {
      const response = await fetch("https://openrouter.ai/api/v1/models");
      const data = await response.json();
      const select = document.getElementById("modelSelect");
      select.innerHTML = ""; 

      const modelosOrdenados = data.data.sort((a, b) => a.name.localeCompare(b.name));

      modelosOrdenados.forEach(model => {
        const pPrompt = model.pricing && model.pricing.prompt ? parseFloat(model.pricing.prompt) : 0;
        const pCompletion = model.pricing && model.pricing.completion ? parseFloat(model.pricing.completion) : 0;

        precosModelos[model.id] = {
          input: pPrompt,
          output: pCompletion
        };

        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = `${model.name}`;
        select.appendChild(option);
      });
    } catch (error) {
      document.getElementById("modelSelect").innerHTML = '<option value="">Erro ao carregar modelos da rede</option>';
      console.error("Erro ao buscar modelos:", error);
    }
  }

  function calcularCusto() {
    const inputTokens = parseFloat(document.getElementById("inputTokens").value) || 0;
    const outputTokens = parseFloat(document.getElementById("outputTokens").value) || 0;
    const modeloSelecionado = document.getElementById("modelSelect").value;

    if (!modeloSelecionado || !precosModelos[modeloSelecionado]) {
      alert("Por favor, selecione um modelo válido.");
      return;
    }

    const precos = precosModelos[modeloSelecionado];

    const custoInput = inputTokens * precos.input;
    const custoOutput = outputTokens * precos.output;
    const custoTotal = custoInput + custoOutput;

    document.getElementById("resultado").innerText = "US$ " + custoTotal.toFixed(6);
  }

  carregarModelos();
</script>
