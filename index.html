<div style="margin-bottom: 20px;">
    <label><strong>Selecione o Modelo:</strong><br>
      <select id="modelSelect" style="padding: 5px; width: 100%; max-width: 300px;">
        <option value="gpt4o">OpenAI - GPT-4o</option>
        <option value="gpt4omini">OpenAI - GPT-4o mini</option>
        <option value="claude35sonnet">Anthropic - Claude 3.5 Sonnet</option>
        <option value="claude35haiku">Anthropic - Claude 3.5 Haiku</option>
        <option value="gemini15pro">Google - Gemini 1.5 Pro</option>
        <option value="gemini15flash">Google - Gemini 1.5 Flash</option>
        <option value="llama31_8b">Groq - Llama 3.1 8B</option>
        <option value="deepseek">DeepSeek - Coder/Chat</option>
      </select>
    </label>
  </div>

  <button onclick="calcularCusto()" style="padding: 10px 15px; background: #0366d6; color: white; border: none; border-radius: 5px; cursor: pointer;">Calcular Custo</button>
  
  <h3 style="margin-top: 20px;">Custo Estimado: <span id="resultado" style="color: #28a745;">US$ 0.00</span></h3>
</div>

<script>
  // Dicionário com os preços de TODOS os modelos por 1 milhão de tokens
  const precosModelos = {
    "gpt4o": { input: 2.50, output: 10.00 },
    "gpt4omini": { input: 0.15, output: 0.60 },
    "claude35sonnet": { input: 3.00, output: 15.00 },
    "claude35haiku": { input: 0.25, output: 1.25 },
    "gemini15pro": { input: 3.50, output: 10.50 },
    "gemini15flash": { input: 0.075, output: 0.30 },
    "llama31_8b": { input: 0.05, output: 0.90 },
    "deepseek": { input: 0.14, output: 0.28 }
  };

  function calcularCusto() {
    const inputTokens = parseFloat(document.getElementById("inputTokens").value) || 0;
    const outputTokens = parseFloat(document.getElementById("outputTokens").value) || 0;
    const modeloSelecionado = document.getElementById("modelSelect").value;

    const precos = precosModelos[modeloSelecionado];

    const custoInput = (inputTokens / 1000000) * precos.input;
    const custoOutput = (outputTokens / 1000000) * precos.output;
    const custoTotal = custoInput + custoOutput;

    document.getElementById("resultado").innerText = "US$ " + custoTotal.toFixed(4);
  }
</script>
